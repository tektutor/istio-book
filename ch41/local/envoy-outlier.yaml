# productpage's Envoy in zone-a, calling ratings, with the cluster and the
# retry policy that istiod 1.31.1 generated for a DestinationRule with the
# outlier detection of ch41/istio/where-outlier.yaml. The pod addresses
# are replaced by the loopback addresses of backends.py. The other
# envoy-*.yaml files in this folder differ in the ratings cluster and,
# for zone-aware routing, add the cluster local_cluster.
node:
  id: productpage-a
  cluster: productpage
  locality: {region: lab, zone: zone-a}                       # (1)
admin:
  address: {socket_address: {address: 127.0.0.1, port_value: 18701}}
cluster_manager: {}
static_resources:
  listeners:
  - name: l
    address: {socket_address: {address: 127.0.0.1, port_value: 18700}}
    filter_chains:
    - filters:
      - name: hcm
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            http_connection_manager.v3.HttpConnectionManager"
          stat_prefix: l
          route_config:
            virtual_hosts:
            - name: v
              domains: ["*"]
              routes:
              - match: {prefix: /}
                route:
                  cluster: ratings
                  timeout: 5s
                  retry_policy:                                # (2)
                    retryOn: "connect-failure,refused-stream,unavailable,\
                      cancelled,retriable-status-codes"
                    numRetries: 2
                    retryHostPredicate:
                    - name: envoy.retry_host_predicates.previous_hosts
                      typedConfig:
                        "@type": "type.googleapis.com/envoy.extensions.retry.\
                          host.previous_hosts.v3.PreviousHostsPredicate"
                    hostSelectionRetryMaxAttempts: "5"
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                router.v3.Router"
  clusters:
  - name: ratings
    type: STATIC
    connect_timeout: 1s
    lb_policy: LEAST_REQUEST
    common_lb_config:
      healthyPanicThreshold: {}                                # (3)
    load_assignment:
      cluster_name: ratings
      endpoints:
      - locality: {region: dr, zone: dr-a}
        lbEndpoints:
        - endpoint:
            address: {socketAddress: {address: 127.0.0.14, portValue: 9080}}
          healthStatus: HEALTHY
          loadBalancingWeight: 1
        loadBalancingWeight: 1
        priority: 2                                            # (4)
      - locality: {region: lab, zone: zone-a}
        lbEndpoints:
        - endpoint:
            address: {socketAddress: {address: 127.0.0.11, portValue: 9080}}
          healthStatus: HEALTHY
          loadBalancingWeight: 1
        loadBalancingWeight: 1
      - locality: {region: lab, zone: zone-b}
        lbEndpoints:
        - endpoint:
            address: {socketAddress: {address: 127.0.0.12, portValue: 9080}}
          healthStatus: HEALTHY
          loadBalancingWeight: 1
        loadBalancingWeight: 1
        priority: 1
      - locality: {region: lab, zone: zone-c}
        lbEndpoints:
        - endpoint:
            address: {socketAddress: {address: 127.0.0.13, portValue: 9080}}
          healthStatus: HEALTHY
          loadBalancingWeight: 1
        loadBalancingWeight: 1
        priority: 1
    outlier_detection:                                         # (5)
      consecutive5xx: 3
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
      enforcingConsecutive5xx: 100
      enforcingSuccessRate: 0

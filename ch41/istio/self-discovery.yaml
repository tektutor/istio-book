# Turns on self-discovery for the sidecars of a Deployment: pilot-agent
# adds the cluster local_cluster, the callers' own pods, to Envoy.
# Apply with: kubectl patch deployment productpage-v1 -n bookinfo
#   --patch-file ch41/istio/self-discovery.yaml
spec:
  template:
    metadata:
      annotations:
        proxy.istio.io/config: |
          proxyMetadata:
            ISTIO_META_ENABLE_SELF_DISCOVERY: "true"

apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: shop
spec:
  replicas: 1                       # (1)
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
        version: v1
    spec:
      serviceAccountName: inventory   # (5)
      securityContext:                # (6)
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: inventory
        image: tektutor/inventory:1.0   # (2)
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: POD_NAME                # (3)
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: shop
spec:
  selector:
    app: inventory
  ports:
  - name: http                      # (4)
    port: 8080
    targetPort: 8080
    appProtocol: http

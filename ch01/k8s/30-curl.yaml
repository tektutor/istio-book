apiVersion: v1
kind: ServiceAccount
metadata:
  name: curl
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl
  template:
    metadata:
      labels:
        app: curl
        version: v1
    spec:
      serviceAccountName: curl
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: curl
        image: docker.io/curlimages/curl:8.16.0
        command: ["sleep", "infinity"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi

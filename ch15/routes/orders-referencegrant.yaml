# A route in the ingress namespace that sends traffic to a Service in
# the shop namespace. The ReferenceGrant in shop allows it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-api
  namespace: ingress
spec:
  parentRefs:
  - name: public
    sectionName: http
  hostnames:
  - shop.tektutor.test
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/orders/
    backendRefs:
    - name: orders
      namespace: shop                              # (1)
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: ingress-routes-to-orders
  namespace: shop                                  # (2)
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: ingress
  to:
  - group: ""
    kind: Service
    name: orders                                   # (3)

# TLS passthrough: the gateway reads the server name from the TLS
# handshake and forwards the encrypted connection. The backend holds the
# certificate and terminates TLS itself.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: secure
  namespace: shop
spec:
  gatewayClassName: istio
  listeners:
  - name: tls
    port: 443
    protocol: TLS
    hostname: "*.tektutor.test"
    tls:
      mode: Passthrough                            # (1)
    allowedRoutes:
      kinds:
      - kind: TLSRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: reports
  namespace: shop
spec:
  parentRefs:
  - name: secure
    sectionName: tls
  hostnames:
  - reports.tektutor.test                          # (2)
  rules:
  - backendRefs:
    - name: reports
      port: 8443

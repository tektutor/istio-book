# Bookinfo's route through the shared gateway, owned by the Bookinfo team
# and kept in the bookinfo namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookinfo
  namespace: bookinfo
spec:
  parentRefs:                                      # (1)
  - name: public
    namespace: ingress
    sectionName: http
  hostnames:                                       # (2)
  - bookinfo.tektutor.test
  - bookinfo.apps-crc.testing
  rules:
  - matches:                                       # (3)
    - path:
        type: Exact
        value: /productpage
    - path:
        type: PathPrefix
        value: /static
    - path:
        type: Exact
        value: /login
    - path:
        type: Exact
        value: /logout
    - path:
        type: PathPrefix
        value: /api/v1/products
    backendRefs:                                   # (4)
    - name: productpage
      port: 9080

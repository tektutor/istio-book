# A mesh route: its parent is the reviews Service, not a Gateway, so it
# applies to every call to reviews from inside the mesh.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reviews
  namespace: bookinfo
spec:
  parentRefs:
  - group: ""                                      # (1)
    kind: Service
    name: reviews
    port: 9080
  rules:
  - backendRefs:
    - name: reviews-v3                             # (2)
      port: 9080

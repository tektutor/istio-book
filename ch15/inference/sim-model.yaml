# Three replicas of the vLLM simulator from the llm-d project. It answers
# the OpenAI-style API of a vLLM model server and reports the same
# metrics, without a model or a GPU.
apiVersion: v1
kind: Namespace
metadata:
  name: models
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-model
  namespace: models
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sim-model
  template:
    metadata:
      labels:
        app: sim-model
        inference.networking.k8s.io/engine-type: vllm    # (1)
    spec:
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
        imagePullPolicy: IfNotPresent
        args:
        - --model
        - Qwen/Qwen3-0.6B                          # (2)
        - --port
        - "8000"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 32Mi

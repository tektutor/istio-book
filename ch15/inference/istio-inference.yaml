# Turns on Gateway API Inference Extension support in istiod. Apply it on
# top of the lab installation:
#   istioctl install -f ch13/istio/lab-install-ambient.yaml \
#     -f ch15/inference/istio-inference.yaml
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  values:
    pilot:
      env:
        ENABLE_GATEWAY_API_INFERENCE_EXTENSION: "true"

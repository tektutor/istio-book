# A gateway for model traffic, and a route whose backend is an
# InferencePool instead of a Service.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference
  namespace: models
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sim-model
  namespace: models
spec:
  parentRefs:
  - name: inference
    sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/
    backendRefs:
    - group: inference.networking.k8s.io           # (1)
      kind: InferencePool
      name: sim-model
    timeouts:
      request: 300s                                # (2)

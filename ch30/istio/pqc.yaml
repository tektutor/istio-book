# The pqc compliance policy: TLS 1.3 with the hybrid post-quantum key
# exchange X25519MLKEM768, for every TLS connection that istiod configures
# and for ztunnel. Experimental in Istio 1.31. On top of the lab
# installation:
#   istioctl install -f ch13/istio/lab-install-ambient.yaml \
#     -f ch29/istio/trust-domain.yaml -f ch30/istio/pqc.yaml -y
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  values:
    pilot:
      env:
        COMPLIANCE_POLICY: pqc                                 # (1)
    ztunnel:
      env:
        COMPLIANCE_POLICY: pqc                                 # (2)

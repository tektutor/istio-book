# The workloads of Lab 30.3: the reports service, with its API and its
# metrics on two container ports, and a curl client inside the mesh.
# The program is ch30/k8s/reports.py, loaded from the ConfigMap reports.
apiVersion: v1
kind: Namespace
metadata:
  name: reports
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Service
metadata:
  name: reports
  namespace: reports
spec:
  selector: {app: reports}
  ports:
  - {name: http, port: 80, targetPort: 8080}             # (1)
  - {name: http-metrics, port: 9090, targetPort: 9100}   # (2)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: reports
spec:
  replicas: 1
  selector:
    matchLabels: {app: reports}
  template:
    metadata:
      labels: {app: reports}
    spec:
      containers:
      - name: reports
        image: docker.io/library/python:3.13-slim
        command: ["python3", "/app/reports.py"]
        ports:
        - {name: api, containerPort: 8080}
        - {name: metrics, containerPort: 9100}
        readinessProbe:                                  # (3)
          httpGet: {path: /ready, port: 8080}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
        volumeMounts: [{name: app, mountPath: /app}]
      volumes:
      - name: app
        configMap: {name: reports}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: reports
spec:
  replicas: 1
  selector:
    matchLabels: {app: curl}
  template:
    metadata:
      labels: {app: curl}
    spec:
      containers:
      - name: curl
        image: docker.io/curlimages/curl:8.16.0
        command: ["sleep", "infinity"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}

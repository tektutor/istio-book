# PostgreSQL 18 for the shop, with one replica and a 1 GiB volume. The
# Service port has no name at first, so Istio has to detect the protocol.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: shop
stringData:
  POSTGRES_USER: shop
  POSTGRES_PASSWORD: lab-only-password              # (1)
  POSTGRES_DB: shop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: shop
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shop
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        version: v1
    spec:
      serviceAccountName: postgres
      containers:
      - name: postgres
        image: docker.io/library/postgres:18.6
        envFrom:
        - secretRef:
            name: postgres
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata    # (2)
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "shop", "-d", "shop"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shop
spec:
  selector:
    app: postgres
  ports:
  - port: 5432                                      # (3)
    targetPort: 5432

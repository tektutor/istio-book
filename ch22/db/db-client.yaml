# A pod with psql in it, to call PostgreSQL from inside the mesh. It
# takes the password from the same Secret as the database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-client
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-client
  template:
    metadata:
      labels:
        app: db-client
    spec:
      containers:
      - name: psql
        image: docker.io/library/postgres:18.6
        command: ["sleep", "infinity"]
        env:
        - name: PGHOST
          value: postgres
        - name: PGUSER
          value: shop
        - name: PGDATABASE
          value: shop
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: 10m
            memory: 32Mi

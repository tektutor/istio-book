# Two ways to spread gRPC calls over three stock servers:
#   18900  layer 4, like a Kubernetes Service without a mesh: the proxy
#          picks a server once per connection
#   18901  layer 7, like a sidecar: the proxy reads HTTP/2 and picks a
#          server for every request
#   18902  layer 7 with a stream idle timeout of 2 seconds, like the
#          EDGE profile on a gateway, which uses 5 minutes
static_resources:
  listeners:
  - name: layer4
    address:
      socket_address: { address: 127.0.0.1, port_value: 18900 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            tcp_proxy.v3.TcpProxy"
          stat_prefix: layer4
          cluster: stock_tcp                                 # (1)
  - name: layer7
    address:
      socket_address: { address: 127.0.0.1, port_value: 18901 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            http_connection_manager.v3.HttpConnectionManager"
          stat_prefix: layer7
          codec_type: AUTO                                   # (2)
          stream_idle_timeout: 0s
          route_config:
            virtual_hosts:
            - name: stock
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: stock_grpc, timeout: 0s }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                router.v3.Router"
  - name: layer7_idle
    address:
      socket_address: { address: 127.0.0.1, port_value: 18902 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            http_connection_manager.v3.HttpConnectionManager"
          stat_prefix: layer7_idle
          codec_type: AUTO
          stream_idle_timeout: 2s                            # (5)
          route_config:
            virtual_hosts:
            - name: stock
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: stock_grpc, timeout: 0s }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                router.v3.Router"
  clusters:
  - name: stock_tcp
    connect_timeout: 2s
    lb_policy: ROUND_ROBIN
    load_assignment: &servers
      cluster_name: stock
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 19091 } } }
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 19092 } } }
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 19093 } } }
  - name: stock_grpc
    connect_timeout: 2s
    lb_policy: LEAST_REQUEST                                 # (3)
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": "type.googleapis.com/envoy.extensions.upstreams.http.\
          v3.HttpProtocolOptions"
        explicit_http_config:
          http2_protocol_options: {}                         # (4)
    load_assignment: *servers
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 19907 }

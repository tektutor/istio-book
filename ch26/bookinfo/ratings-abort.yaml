# HTTP 500 for every call to ratings that carries melissa's user name.
# QA logs in as melissa; real users are never affected.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ratings
  namespace: bookinfo
spec:
  hosts:
  - ratings
  http:
  - name: melissa-abort
    match:
    - headers:
        end-user:
          exact: melissa
    fault:
      abort:
        httpStatus: 500                            # (1)
        percentage:
          value: 100
    route:
    - destination:
        host: ratings
        port:
          number: 9080
  - name: everyone-else
    route:
    - destination:
        host: ratings
        port:
          number: 9080

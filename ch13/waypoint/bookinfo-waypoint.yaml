# A waypoint for the bookinfo namespace, as istioctl waypoint generate
# prints it. It handles traffic addressed to the namespace's services.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: bookinfo
spec:
  gatewayClassName: istio-waypoint    # (1)
  listeners:
  - name: mesh
    port: 15008                       # (2)
    protocol: HBONE

# Guardrail 4: warn, but do not block, when a VirtualService route has
# no timeout. Istio's default is no timeout at all (Chapter 24).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mesh-route-timeout-warn
spec:
  failurePolicy: Ignore                                       # (1)
  matchConstraints:
    resourceRules:
    - apiGroups: ["networking.istio.io"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE"]
      resources: ["virtualservices"]
  validations:
  - expression: >-
      !has(object.spec.http) ||
      object.spec.http.all(route, has(route.timeout))
    message: "Every HTTP route should set a timeout. See the mesh guide."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mesh-route-timeout-warn
spec:
  policyName: mesh-route-timeout-warn
  validationActions: ["Warn", "Audit"]                        # (2)

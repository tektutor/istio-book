# Generated by the mesh-service template for ${{ values.namespace }}/${{ values.name }}.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  labels:
    mesh.tektutor.org/generated-by: golden-path
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: ${{ values.name }}
    port: ${{ values.port }}
  rules:
  - backendRefs:
    - name: ${{ values.name }}
      port: ${{ values.port }}
    timeouts:
      request: 5s
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ${{ values.name }}-allow-callers
  namespace: ${{ values.namespace }}
  labels:
    mesh.tektutor.org/generated-by: golden-path
spec:
  selector:
    matchLabels:
      app: ${{ values.name }}
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
{%- for caller in values.callers %}
        - cluster.local/ns/${{ values.namespace }}/sa/${{ caller }}
{%- endfor %}

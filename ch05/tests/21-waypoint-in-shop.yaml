# Expected result: allowed. A waypoint is a Gateway with the
# istio-waypoint class.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: shop
spec:
  gatewayClassName: istio-waypoint     # (1)
  listeners:
  - name: mesh
    port: 15008                        # (2)
    protocol: HBONE

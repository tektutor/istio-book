apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-1.2.0
  name: shop-api-shop-tektutor-test
  namespace: shop
spec:
  hostnames:
  - shop.tektutor.test
  parentRefs:
  - name: nginx
    port: 443
    sectionName: shop-tektutor-test-https
  rules:
  - backendRefs:
    - name: cart
      port: 8080
    filters:
    - cors:
        allowCredentials: true
        allowHeaders:
        - content-type
        - x-shop-user
        allowMethods:
        - GET
        - PUT
        - POST
        - DELETE
        - PATCH
        - OPTIONS
        allowOrigins:
        - http://localhost:5173
        maxAge: 1728000
      type: CORS
    matches:
    - path:
        type: RegularExpression
        value: (?i)/api/cart.*
    timeouts:
      request: 5m0s
  - backendRefs:
    - name: orders
      port: 8080
    filters:
    - cors:
        allowCredentials: true
        allowHeaders:
        - content-type
        - x-shop-user
        allowMethods:
        - GET
        - PUT
        - POST
        - DELETE
        - PATCH
        - OPTIONS
        allowOrigins:
        - http://localhost:5173
        maxAge: 1728000
      type: CORS
    matches:
    - path:
        type: RegularExpression
        value: (?i)/api/orders.*
    timeouts:
      request: 5m0s
  - backendRefs:
    - name: inventory
      port: 8080
      weight: 90
    - name: inventory-v2
      port: 8080
      weight: 10
    filters:
    - cors:
        allowCredentials: true
        allowHeaders:
        - content-type
        - x-shop-user
        allowMethods:
        - GET
        - PUT
        - POST
        - DELETE
        - PATCH
        - OPTIONS
        allowOrigins:
        - http://localhost:5173
        maxAge: 1728000
      type: CORS
    matches:
    - path:
        type: RegularExpression
        value: (?i)/api/stock.*
    timeouts:
      request: 5m0s
  - backendRefs:
    - name: cart
      port: 8080
    matches:
    - path:
        type: RegularExpression
        value: (?i)/api/v1/(cart)(/|$)(.*).*
  - backendRefs:
    - name: orders
      port: 8080
    matches:
    - path:
        type: RegularExpression
        value: (?i)/api/v1/(orders)(/|$)(.*).*
  - backendRefs:
    - name: cart
      port: 8080
    matches:
    - path:
        type: RegularExpression
        value: (?i)/api/basket.*
  - filters:
    - requestRedirect:
        hostname: shop.tektutor.test
        path:
          replaceFullPath: /
          type: ReplaceFullPath
        scheme: https
        statusCode: 301
      type: RequestRedirect
    matches:
    - path:
        type: RegularExpression
        value: (?i)/catalogue.*
  - backendRefs:
    - name: frontend
      port: 8080
    matches:
    - path:
        type: RegularExpression
        value: (?i)/.*
status:
  parents: []
---

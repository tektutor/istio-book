# The admin host and the gRPC host after the migration.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin
  namespace: shop
spec:
  parentRefs:
  - name: shop-edge
    sectionName: admin
  hostnames: [admin.tektutor.test]
  rules:
  - matches: [{path: {type: PathPrefix, value: /orders}}]     # route 9
    backendRefs: [{name: orders, port: 8080}]
  - matches: [{path: {type: PathPrefix, value: /stock}}]      # route 10
    backendRefs: [{name: inventory, port: 8080}]
  - matches: [{path: {type: PathPrefix, value: /}}]           # route 11
    backendRefs: [{name: frontend, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: stock-grpc
  namespace: shop
spec:
  parentRefs:
  - name: shop-edge
    sectionName: grpc
  hostnames: [grpc.tektutor.test]
  rules:
  - backendRefs: [{name: stock-grpc, port: 9090}]             # route 12

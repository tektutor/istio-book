# Mesh routing with Gateway API: a two-second timeout for every call
# to the inventory Service, from any client in the mesh.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory
  namespace: shop
spec:
  parentRefs:                 # (1)
  - group: ""
    kind: Service
    name: inventory
    port: 8080
  rules:
  - backendRefs:              # (2)
    - name: inventory
      port: 8080
    timeouts:
      request: 2s             # (3)

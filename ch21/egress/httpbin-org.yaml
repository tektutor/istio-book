# httpbin.org, defined once for the whole mesh in the egress namespace.
# Port 80 is what the applications call; port 443 is what the egress
# gateway calls after it adds TLS.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: httpbin-org
  namespace: egress
spec:
  hosts:
  - httpbin.org
  location: MESH_EXTERNAL
  ports:
  - number: 80
    name: http
    protocol: HTTP
  - number: 443
    name: https
    protocol: HTTPS                     # (1)
  resolution: DNS

# Two routes make the path. The first applies in every sidecar of the
# mesh: calls to httpbin.org go to the egress gateway. The second
# applies in the gateway: requests go on to httpbin.org on port 443.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-to-egress-gateway
  namespace: egress
spec:
  parentRefs:
  - kind: ServiceEntry                                 # (1)
    group: networking.istio.io
    name: httpbin-org
  rules:
  - backendRefs:
    - name: egress-gateway-istio
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-from-egress-gateway
  namespace: egress
spec:
  parentRefs:
  - name: egress-gateway                               # (2)
  hostnames:
  - httpbin.org
  rules:
  - backendRefs:
    - kind: Hostname                                   # (3)
      group: networking.istio.io
      name: httpbin.org
      port: 443
---
# TLS origination: the gateway opens TLS to port 443. Without
# caCertificates, Istio checks the server certificate against the
# operating system's CA bundle in the proxy image.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: httpbin-org-tls
  namespace: egress
spec:
  host: httpbin.org
  trafficPolicy:
    portLevelSettings:
    - port:
        number: 443
      tls:
        mode: SIMPLE                                   # (4)

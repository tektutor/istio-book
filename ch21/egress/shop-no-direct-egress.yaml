# The network-level backstop. Pods in the shop namespace may only reach
# pods inside the cluster and the cluster DNS server. A call that skips
# the egress gateway, for example from a pod without a sidecar, fails.
# Your network plugin must enforce NetworkPolicy for this to work.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: no-direct-egress
  namespace: shop
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}                            # (1)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

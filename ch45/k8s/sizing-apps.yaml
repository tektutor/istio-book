# The workloads of Lab 45.3: a service called echo, whose sidecar you
# size, and a load generator that calls it. Both are Fortio: the server
# answers every request at once, so the proxy's work is easy to see.
apiVersion: v1
kind: Namespace
metadata:
  name: sizing
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: sizing
spec:
  selector: {app: echo}
  ports: [{name: http, port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: sizing
spec:
  replicas: 1                                            # (1)
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      containers:
      - name: echo
        image: docker.io/fortio/fortio:1.76.0
        args: ["server", "-http-port", "8080"]
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 100m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
  namespace: sizing
spec:
  replicas: 1
  selector:
    matchLabels: {app: load}
  template:
    metadata:
      labels: {app: load}
    spec:
      containers:
      - name: load
        image: docker.io/fortio/fortio:1.76.0
        args: ["server"]                                  # (2)
        resources:
          requests: {cpu: 200m, memory: 32Mi}

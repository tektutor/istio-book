# A patch for the echo Deployment: proxy requests and limits from the
# worked example of Lab 45.3, and a fixed number of worker threads.
# Replace the numbers with those from your own measurement before you
# apply it.   kubectl patch deployment echo -n sizing --patch-file <this>
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: 250m                  # (1)
        sidecar.istio.io/proxyMemory: 96Mi               # (2)
        sidecar.istio.io/proxyCPULimit: "1"              # (3)
        sidecar.istio.io/proxyMemoryLimit: 256Mi         # (4)
        proxy.istio.io/config: |
          concurrency: 2                                 # (5)

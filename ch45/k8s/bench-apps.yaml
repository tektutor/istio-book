# One Fortio server and one Fortio client in each of three namespaces: no
# mesh, sidecars, and ambient mode. Clients run on node perf-m02 and
# servers on perf-m03, so every request crosses nodes, as in production.
# ch45/k8s/create-perf-lab.sh creates the namespaces and applies this
# file once per namespace with kubectl apply -n.
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector: {app: server}
  ports: [{name: http, port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  selector:
    matchLabels: {app: server}
  template:
    metadata:
      labels: {app: server}
    spec:
      nodeSelector: {kubernetes.io/hostname: perf-m03}          # (1)
      tolerations:
      - {key: bench, operator: Exists, effect: NoSchedule}
      containers:
      - name: server
        image: docker.io/fortio/fortio:1.76.0
        args: ["server"]
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 500m, memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels: {app: client}
  template:
    metadata:
      labels: {app: client}
    spec:
      nodeSelector: {kubernetes.io/hostname: perf-m02}
      tolerations:
      - {key: bench, operator: Exists, effect: NoSchedule}
      containers:
      - name: client
        image: docker.io/fortio/fortio:1.76.0
        args: ["server", "-http-port", "9999"]                   # (2)
        resources:
          requests: {cpu: 500m, memory: 64Mi}

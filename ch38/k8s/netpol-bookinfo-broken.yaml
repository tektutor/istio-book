# A NetworkPolicy for bookinfo as many teams first write it: the
# application port from the mesh's namespaces, and nothing else. In
# ambient mode, mesh traffic arrives on port 15008, so it is dropped.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-from-mesh
  namespace: bookinfo
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: bookinfo
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: shop
    ports:
    - { protocol: TCP, port: 9080 }                            # (1)

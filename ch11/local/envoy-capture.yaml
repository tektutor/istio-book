# A minimal stand-in for the sidecar's two capture listeners. Real
# Istio sidecars have many more listeners and filters; these two only
# show where captured connections arrive and where they go next.
admin:
  address:
    socket_address: {address: 127.0.0.1, port_value: 15000}
static_resources:
  listeners:
  - name: virtualOutbound                   # (1)
    address:
      socket_address: {address: 0.0.0.0, port_value: 15001}
    listener_filters:
    - name: envoy.filters.listener.original_dst   # (2)
      typed_config:
        "@type": "type.googleapis.com/envoy.extensions.filters.\
          listener.original_dst.v3.OriginalDst"
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.\
            network.tcp_proxy.v3.TcpProxy"
          stat_prefix: outbound
          cluster: PassthroughCluster
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.\
                access_loggers.stream.v3.StdoutAccessLog"
              log_format:
                text_format_source:
                  inline_string: "%DOWNSTREAM_REMOTE_ADDRESS% ->
                    %DOWNSTREAM_LOCAL_ADDRESS% via %UPSTREAM_CLUSTER%
                    from %UPSTREAM_LOCAL_ADDRESS%\n"
  - name: virtualInbound                    # (3)
    address:
      socket_address: {address: 0.0.0.0, port_value: 15006}
    listener_filters:
    - name: envoy.filters.listener.original_dst
      typed_config:
        "@type": "type.googleapis.com/envoy.extensions.filters.\
          listener.original_dst.v3.OriginalDst"
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.\
            network.tcp_proxy.v3.TcpProxy"
          stat_prefix: inbound
          cluster: InboundPassthroughCluster
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.\
                access_loggers.stream.v3.StdoutAccessLog"
              log_format:
                text_format_source:
                  inline_string: "%DOWNSTREAM_REMOTE_ADDRESS% ->
                    %DOWNSTREAM_LOCAL_ADDRESS% via %UPSTREAM_CLUSTER%
                    from %UPSTREAM_LOCAL_ADDRESS%\n"
  clusters:
  - name: PassthroughCluster                # (4)
    type: ORIGINAL_DST
    lb_policy: CLUSTER_PROVIDED
    connect_timeout: 2s
  - name: InboundPassthroughCluster
    type: ORIGINAL_DST
    lb_policy: CLUSTER_PROVIDED
    connect_timeout: 2s
    upstream_bind_config:                   # (5)
      source_address: {address: 127.0.0.6, port_value: 0}

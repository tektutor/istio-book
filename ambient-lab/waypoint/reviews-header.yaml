# The routes that istiod builds for the waypoint from the HTTPRoute in
# ch36/istio/reviews-route-header.yaml: requests with end-user: melissa go
# to reviews-v2, all others to reviews-v1.
resources:
- "@type": type.googleapis.com/envoy.config.route.v3.RouteConfiguration
  name: "inbound-vip|9080|http|reviews.bookinfo.svc.cluster.local"
  virtual_hosts:
  - name: "inbound|http|9080"
    domains: ["*"]
    routes:
    - name: bookinfo.reviews.0                                  # (1)
      match:
        prefix: /
        headers:
        - name: end-user
          string_match: { exact: melissa }
      route:
        cluster: "inbound-vip|9080|http|reviews-v2.bookinfo.svc.cluster.local"
        timeout: 0s
        retry_policy: &mesh_default                             # (2)
          retry_on: "connect-failure,refused-stream,unavailable,cancelled,\
            retriable-status-codes"
          num_retries: 2
          host_selection_retry_max_attempts: 5
          retry_host_predicate:
          - name: envoy.retry_host_predicates.previous_hosts
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.retry.host.\
                previous_hosts.v3.PreviousHostsPredicate"
    - name: bookinfo.reviews.1
      match: { prefix: / }
      route:
        cluster: "inbound-vip|9080|http|reviews-v1.bookinfo.svc.cluster.local"
        timeout: 0s
        retry_policy: *mesh_default

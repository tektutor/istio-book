# Only productpage may read reviews, and only with GET. targetRefs binds
# the policy to the Service, so the waypoint of reviews enforces it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: reviews-viewers
  namespace: bookinfo
spec:
  targetRefs:
  - kind: Service                                              # (1)
    group: ""
    name: reviews
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - tektutor.org/ns/bookinfo/sa/bookinfo-productpage
    to:
    - operation:
        methods: ["GET"]                                       # (2)

# A Wasm plugin on the bookinfo waypoint: the basic-auth example from
# Istio's documentation, for requests to /productpage. targetRefs names
# the waypoint's Gateway, so only that waypoint loads the plugin.
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: basic-auth-at-waypoint
  namespace: bookinfo
spec:
  targetRefs:
  - kind: Gateway                                              # (1)
    group: gateway.networking.k8s.io
    name: waypoint
  url: oci://ghcr.io/istio-ecosystem/wasm-extensions/basic_auth:1.12.0
  phase: AUTHN
  pluginConfig:
    basic_auth_rules:
    - prefix: "/productpage"
      request_methods: ["GET", "POST"]
      credentials:
      - "ok:test"                                              # (2)
      - "YWRtaW4zOmFkbWluMw=="

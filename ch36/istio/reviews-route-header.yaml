# An HTTPRoute for the Service reviews, with the Service as its parent:
# requests with the header end-user: melissa go to reviews-v2, all others
# to reviews-v1. In ambient mode, the waypoint of reviews applies it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reviews
  namespace: bookinfo
spec:
  parentRefs:
  - group: ""                                                  # (1)
    kind: Service
    name: reviews
    port: 9080
  rules:
  - matches:
    - headers:
      - name: end-user
        value: melissa
    backendRefs:
    - name: reviews-v2                                         # (2)
      port: 9080
  - backendRefs:
    - name: reviews-v1
      port: 9080

# The cart listens on 8080, like the other shop services.
server.port=8080
spring.application.name=cart

# Where the inventory service is. In the cluster, the mesh resolves the
# short name; on your machine, set INVENTORY_URL.
inventory.url=${INVENTORY_URL:http://inventory:8080}

# Health endpoints for the readiness and liveness probes.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# One log line per request, with the path the cart actually received.
logging.level.org.tektutor.shop.cart=INFO

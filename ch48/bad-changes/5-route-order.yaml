# Pull request 5: "Put the main route first, it is the one most people use."
# Replaces shop/inventory-routes.yaml.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: inventory
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  host: inventory.shop.svc.cluster.local
  subsets:
  - name: v1
    labels: {version: v1}
  - name: v2
    labels: {version: v2}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: inventory
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  hosts:
  - inventory.shop.svc.cluster.local
  http:
  - route:
    - destination:
        host: inventory.shop.svc.cluster.local
        subset: v1
  - match:
    - headers:
        x-beta:
          exact: "true"
    route:
    - destination:
        host: inventory.shop.svc.cluster.local
        subset: v2

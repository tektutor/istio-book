# Pull request 2: "Let every gateway in the ingress namespace call orders."
# Replaces shop/orders-allow.yaml.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: orders-allow
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    matchLabels:
      app: orders
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/shop/sa/curl
        - cluster.local/ns/shop/sa/default
    - source:
        namespaces: ["ingres"]
    to:
    - operation:
        methods: ["GET"]
        paths: ["/api/orders/*"]

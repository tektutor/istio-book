# Inventory as an Argo Rollout: the pod template of the Deployment from
# Chapter 8, released in steps of 10% and 50%. After the Rollout's pods
# are ready, delete the Deployment; the Rollout owns the pods from then.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: inventory
  namespace: shop
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
        version: v1
    spec:
      serviceAccountName: inventory
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: inventory
        image: tektutor/inventory:1.0                          # (1)
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 64Mi
  strategy:
    canary:
      stableService: inventory-stable
      canaryService: inventory-canary
      trafficRouting:
        istio:
          virtualService:
            name: inventory
            routes: [primary]                                  # (2)
      analysis:                                                # (3)
        templates:
        - templateName: error-rate
        startingStep: 1
        args:
        - name: service
          value: inventory-canary
      steps:
      - setWeight: 10
      - pause: {duration: 3m}
      - setWeight: 50
      - pause: {duration: 3m}

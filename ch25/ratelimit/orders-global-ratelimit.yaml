# The global rate limit on the inbound side of every orders pod. The
# first patch adds Envoy's rate limit filter; the second tells Envoy
# which descriptors to send for each request.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: orders-global-ratelimit
  namespace: shop
spec:
  workloadSelector:
    labels:
      app: orders                                       # (1)
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
            subFilter:
              name: envoy.filters.http.router
    patch:
      operation: INSERT_BEFORE                          # (2)
      value:
        name: envoy.filters.http.ratelimit
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.http.\
            ratelimit.v3.RateLimit"
          domain: shop
          failure_mode_deny: false                      # (3)
          timeout: 100ms
          rate_limit_service:
            transport_api_version: V3
            grpc_service:
              envoy_grpc:
                cluster_name: "outbound|8081||\
                  ratelimit.ratelimit.svc.cluster.local"
                authority: ratelimit.ratelimit.svc.cluster.local
  - applyTo: VIRTUAL_HOST
    match:
      context: SIDECAR_INBOUND
      routeConfiguration:
        vhost:
          name: inbound|http|8080                       # (4)
    patch:
      operation: MERGE
      value:
        rate_limits:
        - actions:
          - header_value_match:                         # (5)
              descriptor_key: path
              descriptor_value: orders-api
              headers:
              - name: ":path"
                string_match:
                  prefix: /api/orders
          - request_headers:                            # (6)
              header_name: x-shop-user
              descriptor_key: client
        - actions:                                      # (7)
          - header_value_match:
              descriptor_key: path
              descriptor_value: orders-api
              headers:
              - name: ":path"
                string_match:
                  prefix: /api/orders

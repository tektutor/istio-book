# Four listeners, each built the way Istio builds it from one setting:
#   18100  a client sidecar with the circuit breaker of a DestinationRule
#   18101  a client sidecar with outlier detection over three pods
#   18102  the orders sidecar's inbound side with a local rate limit
#   18103  the orders sidecar's inbound side with a global rate limit
static_resources:
  listeners:
  - name: circuit_breaker
    address:
      socket_address: { address: 127.0.0.1, port_value: 18100 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            http_connection_manager.v3.HttpConnectionManager"
          stat_prefix: outbound_cb
          route_config:
            virtual_hosts:
            - name: inventory
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route:
                  cluster: "outbound|8080||inventory.shop.svc.cluster.local"
                  timeout: 0s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                router.v3.Router"
  - name: outlier_detection
    address:
      socket_address: { address: 127.0.0.1, port_value: 18101 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            http_connection_manager.v3.HttpConnectionManager"
          stat_prefix: outbound_od
          route_config:
            virtual_hosts:
            - name: inventory
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route:
                  cluster: "outbound|8080||inventory-3.shop.svc.cluster.local"
                  timeout: 0s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                router.v3.Router"
  - name: local_rate_limit
    address:
      socket_address: { address: 127.0.0.1, port_value: 18102 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            http_connection_manager.v3.HttpConnectionManager"
          stat_prefix: inbound_local
          route_config:
            virtual_hosts:
            - name: "inbound|http|8080"
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: "inbound|8080||", timeout: 0s }
          http_filters:
          - name: envoy.filters.http.local_ratelimit                # (1)
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                local_ratelimit.v3.LocalRateLimit"
              stat_prefix: http_local_rate_limiter
              token_bucket:
                max_tokens: 10
                tokens_per_fill: 10
                fill_interval: 1s
              filter_enabled:
                default_value: { numerator: 100, denominator: HUNDRED }
              filter_enforced:
                default_value: { numerator: 100, denominator: HUNDRED }
              response_headers_to_add:
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header: { key: x-local-rate-limit, value: "true" }
          - name: envoy.filters.http.router
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                router.v3.Router"
  - name: global_rate_limit
    address:
      socket_address: { address: 127.0.0.1, port_value: 18103 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            http_connection_manager.v3.HttpConnectionManager"
          stat_prefix: inbound_global
          route_config:
            virtual_hosts:
            - name: "inbound|http|8080"
              domains: ["*"]
              rate_limits:                                           # (2)
              - actions:
                - header_value_match:
                    descriptor_key: path
                    descriptor_value: orders-api
                    headers:
                    - name: ":path"
                      string_match: { prefix: /api/orders }
                - request_headers:
                    header_name: x-shop-user
                    descriptor_key: client
              - actions:
                - header_value_match:
                    descriptor_key: path
                    descriptor_value: orders-api
                    headers:
                    - name: ":path"
                      string_match: { prefix: /api/orders }
              routes:
              - match: { prefix: "/" }
                route: { cluster: "inbound|8080||", timeout: 0s }
          http_filters:
          - name: envoy.filters.http.ratelimit                       # (3)
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                ratelimit.v3.RateLimit"
              domain: shop
              failure_mode_deny: false
              timeout: 1s
              rate_limit_service:
                transport_api_version: V3
                grpc_service:
                  envoy_grpc: { cluster_name: ratelimit }
          - name: envoy.filters.http.router
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                router.v3.Router"
  clusters:
  - name: "outbound|8080||inventory.shop.svc.cluster.local"
    connect_timeout: 10s
    circuit_breakers:                                                # (4)
      thresholds:
      - max_connections: 1
        max_pending_requests: 1
        max_requests: 4294967295
        max_retries: 4294967295
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": "type.googleapis.com/envoy.extensions.upstreams.http.\
          v3.HttpProtocolOptions"
        common_http_protocol_options: { max_requests_per_connection: 1 }
        explicit_http_config: { http_protocol_options: {} }
    load_assignment:
      cluster_name: inventory
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 18080 } } }
  - name: "outbound|8080||inventory-3.shop.svc.cluster.local"
    connect_timeout: 10s
    lb_policy: LEAST_REQUEST
    outlier_detection:                                               # (5)
      consecutive_5xx: 3
      enforcing_consecutive_5xx: 100
      enforcing_success_rate: 0
      interval: 1s
      base_ejection_time: 30s
      max_ejection_percent: 100
    common_lb_config:
      healthy_panic_threshold: { value: 0 }                          # (6)
    load_assignment:
      cluster_name: inventory-3
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 18081 } } }
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 18082 } } }
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 18083 } } }
  - name: "inbound|8080||"
    connect_timeout: 10s
    load_assignment:
      cluster_name: orders
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 18090 } } }
  - name: ratelimit
    connect_timeout: 1s
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": "type.googleapis.com/envoy.extensions.upstreams.http.\
          v3.HttpProtocolOptions"
        explicit_http_config: { http2_protocol_options: {} }
    load_assignment:
      cluster_name: ratelimit
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 18181 } } }
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 19925 }

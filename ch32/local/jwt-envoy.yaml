# The inbound side of the orders sidecar with the filters that istiod
# builds from ch32/istio: JWT validation, a CUSTOM policy that asks OPA,
# and ALLOW rules on the token. The stand-in for the orders application
# answers 200 and echoes the user header that the JWT filter added.
node:
  id: sidecar~127.0.0.1~orders-1.shop~shop.svc.cluster.local
  cluster: orders.shop
static_resources:
  listeners:
  - name: orders_inbound
    address:
      socket_address: { address: 127.0.0.1, port_value: 18960 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            http_connection_manager.v3.HttpConnectionManager"
          stat_prefix: inbound_8080
          route_config:
            virtual_hosts:
            - name: orders
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                direct_response: { status: 200, body: { inline_string: "ok" } }
                response_headers_to_add:
                - header: { key: x-app-saw-user, value: "%REQ(x-shop-user)%" }
          http_filters:
          - name: envoy.filters.http.jwt_authn                        # (1)
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                jwt_authn.v3.JwtAuthentication"
              providers:
                origins-0:
                  issuer: https://keycloak.tektutor.test/realms/shop
                  local_jwks: { filename: /tmp/ch32-tokens/jwks.json }  # (2)
                  payload_in_metadata: payload
                  claim_to_headers:                                   # (3)
                  - header_name: x-shop-user
                    claim_name: preferred_username
              rules:
              - match: { prefix: "/" }
                requires:
                  requires_any:                                       # (4)
                    requirements:
                    - provider_name: origins-0
                    - allow_missing: {}
              bypass_cors_preflight: true
          - name: envoy.filters.http.rbac                             # (5)
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                rbac.v3.RBAC"
              shadow_rules:
                action: DENY
                policies:
                  istio-ext-authz-opa-ns[shop]-policy[orders-limit]-rule[0]:
                    permissions:
                    - and_rules:
                        rules:
                        - or_rules:
                            rules:
                            - url_path: { path: { prefix: /api/orders/ } }
                    principals:
                    - and_ids: { ids: [ { any: true } ] }
              shadow_rules_stat_prefix: istio_ext_authz_
          - name: envoy.filters.http.ext_authz                        # (6)
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                ext_authz.v3.ExtAuthz"
              transport_api_version: V3
              failure_mode_allow: false                               # (7)
              grpc_service:
                envoy_grpc: { cluster_name: opa }
                timeout: 0.5s
              filter_enabled_metadata:
                filter: envoy.filters.http.rbac
                path:
                - key: istio_ext_authz_shadow_effective_policy_id
                value:
                  string_match: { prefix: istio-ext-authz-opa }
          - name: envoy.filters.http.rbac                             # (8)
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                rbac.v3.RBAC"
              rules:
                policies:
                  ns[shop]-policy[orders-require-jwt]-rule[0]:
                    permissions:
                    - and_rules:
                        rules:
                        - or_rules:
                            rules:
                            - url_path: { path: { prefix: /api/orders/ } }
                    principals:
                    - and_ids:
                        ids:
                        - metadata:
                            filter: envoy.filters.http.jwt_authn
                            path: [ { key: payload }, { key: iss } ]
                            value:
                              string_match: { safe_regex: { regex: ".+" } }
                        - metadata:
                            filter: envoy.filters.http.jwt_authn
                            path: [ { key: payload }, { key: sub } ]
                            value:
                              string_match: { safe_regex: { regex: ".+" } }
                  ns[shop]-policy[orders-require-jwt]-rule[1]:
                    permissions:
                    - and_rules:
                        rules:
                        - or_rules:
                            rules:
                            - url_path: { path: { prefix: /api/admin/ } }
                    principals:
                    - and_ids:
                        ids:
                        - metadata:                                   # (9)
                            filter: envoy.filters.http.jwt_authn
                            path:
                            - key: payload
                            - key: realm_access
                            - key: roles
                            value:
                              list_match:
                                one_of: { string_match: { exact: admin } }
          - name: envoy.filters.http.router
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                router.v3.Router"
  clusters:
  - name: opa
    connect_timeout: 1s
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": "type.googleapis.com/envoy.extensions.upstreams.http.\
          v3.HttpProtocolOptions"
        explicit_http_config: { http2_protocol_options: {} }
    load_assignment:
      cluster_name: opa
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 19191 } } }
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 19934 }

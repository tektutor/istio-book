# The Kiali operator provided by Red Hat, from the Red Hat catalog. It
# also installs the OpenShift Service Mesh Console plugin.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kiali-ossm
  namespace: openshift-operators
spec:
  channel: stable
  name: kiali-ossm
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic           # (1)

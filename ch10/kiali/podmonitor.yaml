# Scrapes every sidecar in one namespace. OpenShift monitoring ignores
# the namespaceSelector of a PodMonitor, so apply a copy of this file in
# every mesh namespace:  oc apply -n <namespace> -f podmonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-proxies-monitor
spec:
  selector:
    matchExpressions:
    - key: istio-prometheus-ignore
      operator: DoesNotExist
  podMetricsEndpoints:
  - path: /stats/prometheus
    interval: 30s
    relabelings:
    - action: keep                          # (1)
      sourceLabels: [__meta_kubernetes_pod_container_name]
      regex: "istio-proxy"
    - action: keep
      sourceLabels:
      - __meta_kubernetes_pod_annotationpresent_prometheus_io_scrape
    - action: replace                       # (2)
      regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
      replacement: '[$2]:$1'
      sourceLabels: [__meta_kubernetes_pod_annotation_prometheus_io_port,
                     __meta_kubernetes_pod_ip]
      targetLabel: __address__
    - action: replace
      regex: (\d+);((([0-9]+?)(\.|$)){4})
      replacement: $2:$1
      sourceLabels: [__meta_kubernetes_pod_annotation_prometheus_io_port,
                     __meta_kubernetes_pod_ip]
      targetLabel: __address__
    - action: replace                       # (3)
      sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name,
                     __meta_kubernetes_pod_label_app]
      separator: ";"
      regex: "(.+);.*|.*;(.+)"
      replacement: "${1}${2}"
      targetLabel: app
    - action: replace
      sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_version,
                     __meta_kubernetes_pod_label_version]
      separator: ";"
      regex: "(.+);.*|.*;(.+)"
      replacement: "${1}${2}"
      targetLabel: version
    - action: replace
      sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace

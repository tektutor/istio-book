# One cell as an OpenShift project: the application of ch42/cell/app.yaml
# in the namespace CELL_NAME, with its own gateway, its isolation policy,
# and the permission for the router to send traffic to the gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: CELL_NAME
  labels:
    istio-discovery: enabled
    istio-injection: enabled
    tektutor.org/cell: CELL_NAME
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: cell-app
  namespace: CELL_NAME
spec:
  selector:
    matchLabels:
      app: cell-app
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/CELL_NAME/sa/cell-gw-istio      # (1)
---
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: default
  namespace: CELL_NAME
spec:
  egress:
  - hosts: ["./*", "istio-system/*"]
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: from-router
  namespace: CELL_NAME
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: router                                       # (2)
  to:
  - group: ""
    kind: Service
    name: cell-gw-istio

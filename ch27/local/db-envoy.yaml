# The outbound side of a sidecar for a PostgreSQL service. Istio builds
# a TCP proxy like this one for a port it treats as TCP. Its idle timeout
# is one hour unless a DestinationRule sets connectionPool.tcp.idleTimeout;
# this demo shortens it to three seconds so you need not wait an hour.
static_resources:
  listeners:
  - name: outbound_postgres
    address:
      socket_address: { address: 127.0.0.1, port_value: 15433 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            tcp_proxy.v3.TcpProxy"
          stat_prefix: "outbound|5432||postgres.shop.svc.cluster.local"
          cluster: "outbound|5432||postgres.shop.svc.cluster.local"
          idle_timeout: 3s                                           # (1)
  clusters:
  - name: "outbound|5432||postgres.shop.svc.cluster.local"
    connect_timeout: 10s
    load_assignment:
      cluster_name: postgres
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 15432 } } }
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 19928 }

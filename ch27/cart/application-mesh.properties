# Settings for the cart when it runs in the mesh. The Deployment turns
# them on with SPRING_PROFILES_ACTIVE=mesh; they add to application.properties.

# Shutdown: finish the requests in flight, for at most 20 seconds.
# graceful is the default in Spring Boot 4; it is written here so that
# nobody turns it off by accident.                              # (1)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Tomcat closes a connection that is idle for 60 seconds. That is the
# default, written here because the Sidecar's inbound idle timeout of
# 50 seconds must stay below it.                                # (2)
server.tomcat.keep-alive-timeout=60s

# Trace headers: read W3C and both B3 forms, and write W3C and
# multi-header B3, for any tracing provider in the mesh. Copy
# x-request-id from each request to its calls as well.             # (3)
management.tracing.propagation.consume=W3C,B3,B3_MULTI
management.tracing.propagation.produce=W3C,B3_MULTI
management.tracing.baggage.remote-fields=x-request-id

# Follow the sampling decision of the incoming request, as the default
# parent-based sampler does. Requests without one are sampled at
# 10 percent. No span exporter is set, so the cart sends no spans.  # (4)
management.tracing.sampling.probability=0.1

# The OpenTelemetry starter also pushes metrics to an OTLP collector on
# localhost. The mesh has none yet, so turn the push off.         # (5)
management.otlp.metrics.export.enabled=false

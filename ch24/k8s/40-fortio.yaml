# Fortio, a load testing tool, as a pod in the shop namespace. Its
# sidecar keeps the same retry and timeout counters as the curl pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
        version: v1
      annotations:
        proxy.istio.io/config: |
          proxyStatsMatcher:
            inclusionRegexps:
            - ".*upstream_rq_(total|retry|timeout|per_try_timeout).*"
    spec:
      containers:
      - name: fortio
        image: docker.io/fortio/fortio:1.76.0
        args: ["server"]
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi

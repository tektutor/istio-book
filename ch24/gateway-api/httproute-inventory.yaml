apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory
  namespace: shop
spec:
  parentRefs:
  - group: ""                      # (1)
    kind: Service
    name: inventory
    port: 8080
  rules:
  - backendRefs:
    - name: inventory
      port: 8080
    timeouts:
      request: 10s                 # (2)
      backendRequest: 2s           # (3)
    retry:                         # (4)
      attempts: 3
      codes:
      - 503
      backoff: 25ms

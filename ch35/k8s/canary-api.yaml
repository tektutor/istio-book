# The workloads of Lab 35.3 in their own namespace: one Service, api,
# with two versions behind it, and a curl client. v2 is the canary, and
# it waits two seconds before every answer. The program is
# ch35/local/canary_api.py, loaded from the ConfigMap canary-api.
apiVersion: v1
kind: Namespace
metadata:
  name: lab
  labels:
    istio-injection: enabled                             # (1)
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lab
spec:
  selector: {app: api}                                   # (2)
  ports: [{name: http, port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v1
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: api, version: v1}
  template:
    metadata:
      labels: {app: api, version: v1}                    # (3)
    spec:
      containers:
      - name: api
        image: docker.io/library/python:3.13-slim
        command: ["python3", "/app/canary_api.py"]
        env:
        - {name: VERSION, value: v1}
        ports: [{containerPort: 8080}]
        readinessProbe:
          tcpSocket: {port: 8080}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
        volumeMounts: [{name: app, mountPath: /app}]
      volumes:
      - name: app
        configMap: {name: canary-api}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v2
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: api, version: v2}
  template:
    metadata:
      labels: {app: api, version: v2}
    spec:
      containers:
      - name: api
        image: docker.io/library/python:3.13-slim
        command: ["python3", "/app/canary_api.py"]
        env:
        - {name: VERSION, value: v2}
        - {name: DELAY_SECONDS, value: "2"}              # (4)
        ports: [{containerPort: 8080}]
        readinessProbe:
          tcpSocket: {port: 8080}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
        volumeMounts: [{name: app, mountPath: /app}]
      volumes:
      - name: app
        configMap: {name: canary-api}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: curl}
  template:
    metadata:
      labels: {app: curl}
    spec:
      containers:
      - name: curl
        image: docker.io/curlimages/curl:8.16.0
        command: ["sleep", "infinity"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}

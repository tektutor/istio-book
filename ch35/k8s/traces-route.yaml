# The browser sends its spans to /v1/traces on the shop's own host. The
# gateway passes them to Jaeger's OTLP/HTTP port in istio-system, which
# the ReferenceGrant allows.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser-traces
  namespace: shop
spec:
  parentRefs:
  - name: public
    namespace: ingress
    sectionName: shop-https
  hostnames:
  - shop.tektutor.test
  rules:
  - matches:
    - path:
        type: Exact
        value: /v1/traces                                      # (1)
      method: POST
    backendRefs:
    - name: jaeger-collector
      namespace: istio-system
      port: 4318
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: shop-browser-traces
  namespace: istio-system
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: shop
  to:
  - group: ""
    kind: Service
    name: jaeger-collector                                     # (2)

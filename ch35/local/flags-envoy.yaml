# An outbound listener of the orders sidecar with one route for each
# response flag, Istio's default access log format, and a second copy
# of each log line sent over OpenTelemetry to a collector.
#   18995  the routes; 18996 the authorization service, which says no
node:
  id: sidecar~127.0.0.1~orders-6d4f9-x7k2p.shop~shop.svc.cluster.local
  cluster: orders.shop
static_resources:
  listeners:
  - name: outbound_flags
    traffic_direction: OUTBOUND
    address:
      socket_address: { address: 127.0.0.1, port_value: 18995 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            http_connection_manager.v3.HttpConnectionManager"
          stat_prefix: outbound_flags
          access_log:
          - name: envoy.access_loggers.file                      # (1)
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.access_loggers.\
                file.v3.FileAccessLog"
              path: /tmp/ch35-access.log
              log_format:
                text_format_source:
                  inline_string: "[%START_TIME%] \"%REQ(:METHOD)% \
                    %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" \
                    %RESPONSE_CODE% %RESPONSE_FLAGS% %RESPONSE_CODE_DETAILS% \
                    %CONNECTION_TERMINATION_DETAILS% \
                    \"%UPSTREAM_TRANSPORT_FAILURE_REASON%\" %BYTES_RECEIVED% \
                    %BYTES_SENT% %DURATION% \
                    %RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)% \
                    \"%REQ(X-FORWARDED-FOR)%\" \"%REQ(USER-AGENT)%\" \
                    \"%REQ(X-REQUEST-ID)%\" \"%REQ(:AUTHORITY)%\" \
                    \"%UPSTREAM_HOST%\" %UPSTREAM_CLUSTER_RAW% \
                    %UPSTREAM_LOCAL_ADDRESS% %DOWNSTREAM_LOCAL_ADDRESS% \
                    %DOWNSTREAM_REMOTE_ADDRESS% %REQUESTED_SERVER_NAME% \
                    %ROUTE_NAME%\n"
          - name: envoy.access_loggers.open_telemetry            # (2)
            filter:                                              # (3)
              extension_filter:
                name: envoy.access_loggers.extension_filters.cel
                typed_config:
                  "@type": "type.googleapis.com/envoy.extensions.\
                    access_loggers.filters.cel.v3.ExpressionFilter"
                  expression: "response.code >= 400 || !has(response.code)"
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.access_loggers.\
                open_telemetry.v3.OpenTelemetryAccessLogConfig"
              common_config:
                log_name: otel_envoy_accesslog
                transport_api_version: V3
                grpc_service:
                  envoy_grpc: { cluster_name: otel-collector }
              disable_builtin_labels: true
              body:
                string_value: "%RESPONSE_CODE% %RESPONSE_FLAGS% \
                  %REQ(:METHOD)% %REQ(:PATH)% %UPSTREAM_CLUSTER_RAW%"
              attributes:
                values:
                - key: pod
                  value: { string_value: orders-6d4f9-x7k2p }
                - key: namespace
                  value: { string_value: shop }
                - key: workload
                  value: { string_value: orders }
                - key: response_flags
                  value: { string_value: "%RESPONSE_FLAGS%" }
          route_config:
            virtual_hosts:
            - name: flags
              domains: ["*"]
              typed_per_filter_config:
                envoy.filters.http.ext_authz:                    # (4)
                  "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                    ext_authz.v3.ExtAuthzPerRoute"
                  disabled: true
              retry_policy: &istio_default_retries               # (5)
                retry_on: "connect-failure,refused-stream,unavailable,\
                  cancelled,retriable-status-codes"
                num_retries: 2
                retry_host_predicate:
                - name: envoy.retry_host_predicates.previous_hosts
                  typed_config:
                    "@type": "type.googleapis.com/envoy.extensions.\
                      retry.host.previous_hosts.v3.PreviousHostsPredicate"
                host_selection_retry_max_attempts: 5
              routes:
              - name: uf
                match: { prefix: /uf/ }
                route: { cluster: dead, timeout: 0s }
              - name: uo
                match: { prefix: /uo/ }
                route: { cluster: tiny, timeout: 0s, prefix_rewrite: /slow/ }
              - name: urx
                match: { prefix: /urx/ }
                route:
                  cluster: upstream
                  timeout: 0s
                  prefix_rewrite: /fail/
                  retry_policy: { retry_on: 5xx, num_retries: 2 }  # (6)
              - name: uh
                match: { prefix: /uh/ }
                route: { cluster: empty, timeout: 0s }
              - name: uc
                match: { prefix: /uc/ }
                route:
                  { cluster: upstream, timeout: 0s, prefix_rewrite: /close/ }
              - name: ut
                match: { prefix: /ut/ }
                route:
                  { cluster: upstream, timeout: 0.5s, prefix_rewrite: /slow/ }
              - name: dc
                match: { prefix: /dc/ }
                route: { cluster: upstream, timeout: 0s, prefix_rewrite: /slow/ }
              - name: rl
                match: { prefix: /rl/ }
                route: { cluster: upstream, timeout: 0s, prefix_rewrite: /ok/ }
                typed_per_filter_config:
                  envoy.filters.http.local_ratelimit:            # (7)
                    "@type": "type.googleapis.com/envoy.extensions.filters.\
                      http.local_ratelimit.v3.LocalRateLimit"
                    stat_prefix: http_local_rate_limiter
                    token_bucket:
                      max_tokens: 1
                      tokens_per_fill: 1
                      fill_interval: 60s
                    filter_enabled:
                      default_value: { numerator: 100, denominator: HUNDRED }
                    filter_enforced:
                      default_value: { numerator: 100, denominator: HUNDRED }
              - name: uaex
                match: { prefix: /uaex/ }
                route: { cluster: upstream, timeout: 0s, prefix_rewrite: /ok/ }
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": "type.googleapis.com/envoy.extensions.filters.\
                      http.ext_authz.v3.ExtAuthzPerRoute"
                    check_settings: {}
          http_filters:
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                ext_authz.v3.ExtAuthz"
              transport_api_version: V3
              http_service:
                server_uri:
                  uri: http://127.0.0.1:18996
                  cluster: authz
                  timeout: 0.5s
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                local_ratelimit.v3.LocalRateLimit"
              stat_prefix: http_local_rate_limiter
          - name: envoy.filters.http.router
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                router.v3.Router"
  - name: authz_says_no
    address:
      socket_address: { address: 127.0.0.1, port_value: 18996 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            http_connection_manager.v3.HttpConnectionManager"
          stat_prefix: authz
          route_config:
            virtual_hosts:
            - name: authz
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                direct_response: { status: 403 }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                router.v3.Router"
  clusters:
  - name: upstream
    connect_timeout: 1s
    load_assignment:
      cluster_name: upstream
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 18986 } } }
  - name: dead                                                   # (8)
    connect_timeout: 1s
    load_assignment:
      cluster_name: dead
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 18987 } } }
  - name: tiny                                                   # (9)
    connect_timeout: 1s
    circuit_breakers:
      thresholds:
      - { max_connections: 1, max_pending_requests: 1, max_requests: 1 }
    load_assignment:
      cluster_name: tiny
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 18986 } } }
  - name: empty                                                  # (10)
    connect_timeout: 1s
    load_assignment: { cluster_name: empty }
  - name: authz
    connect_timeout: 1s
    load_assignment:
      cluster_name: authz
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 18996 } } }
  - name: otel-collector
    connect_timeout: 1s
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": "type.googleapis.com/envoy.extensions.upstreams.http.\
          v3.HttpProtocolOptions"
        explicit_http_config: { http2_protocol_options: {} }
    load_assignment:
      cluster_name: otel-collector
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address:
            { address: 127.0.0.1, port_value: 14317 } } }
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 19995 }

# ch19/partner/partner-gateway.yaml for OpenShift Local: the Service gets
# the type ClusterIP, and a passthrough Route brings the partner's TLS
# connection from the OpenShift router to the gateway unopened, so that the
# gateway can check the client certificate.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: partners
  namespace: ingress
  annotations:
    networking.istio.io/service-type: ClusterIP      # OpenShift Local only
spec:
  gatewayClassName: istio
  tls:
    frontend:
      default:
        validation:
          mode: AllowValidOnly                     # (1)
          caCertificateRefs:
          - group: ""
            kind: ConfigMap
            name: partner-ca                       # (2)
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    hostname: partner.tektutor.test
    tls:
      mode: Terminate
      certificateRefs:
      - name: partner-tls
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            tektutor.org/ingress: allowed
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: partner-orders
  namespace: shop
spec:
  parentRefs:
  - name: partners
    namespace: ingress
  hostnames:
  - partner.tektutor.test
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/orders/
    backendRefs:
    - name: orders
      port: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: partners
  namespace: ingress
spec:
  host: partner.tektutor.test
  to:
    kind: Service
    name: partners-istio
  port:
    targetPort: https
  tls:
    termination: passthrough

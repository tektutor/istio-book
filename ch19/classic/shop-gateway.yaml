# The classic API: an Istio Gateway resource for gateway pods that you
# installed with the gateway Helm chart. It selects the pods by label.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: shop-gateway
  namespace: shop
spec:
  selector:
    istio: shop-gateway                            # (1)
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - shop.tektutor.test
    tls:
      mode: SIMPLE                                 # (2)
      credentialName: shop-tls                     # (3)
  - port:
      number: 8443
      name: https-partners
      protocol: HTTPS
    hosts:
    - partner.tektutor.test
    tls:
      mode: MUTUAL                                 # (4)
      credentialName: partner-tls

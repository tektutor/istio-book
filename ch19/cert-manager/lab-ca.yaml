# A small certificate authority for the lab, run by cert-manager:
# a self-signed root, and an issuer that signs with it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}                                   # (1)
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tektutor-lab-ca
  namespace: cert-manager
spec:
  isCA: true                                       # (2)
  commonName: TekTutor Lab CA
  secretName: tektutor-lab-ca
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: tektutor-lab-ca                    # (3)

# Step 1 uses the Eureka name "catalog"; step 2 sets CATALOG_URL to the
# Kubernetes Service, http://catalog:8080, and STOREFRONT_DISCOVERY=false.
spring.application.name=storefront
server.port=8080
catalog.url=${CATALOG_URL:http://catalog}
storefront.discovery=${STOREFRONT_DISCOVERY:true}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health

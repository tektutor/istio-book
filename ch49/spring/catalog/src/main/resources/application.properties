# The catalog registers its pod address with Eureka. Pod host names do
# not resolve in Kubernetes, so it registers the IP address instead.
spring.application.name=catalog
server.port=8080
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health

# The Spring Cloud lab: a Eureka server, two catalog pods and a
# storefront, in a namespace that starts outside the mesh.
apiVersion: v1
kind: Namespace
metadata:
  name: springshop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: springshop
spec:
  replicas: 1
  selector:
    matchLabels: {app: eureka}
  template:
    metadata:
      labels: {app: eureka, version: v1}
    spec:
      containers:
      - name: eureka
        image: tektutor/springshop-eureka:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: eureka
  namespace: springshop
spec:
  selector: {app: eureka}
  ports:
  - {name: http, port: 8761}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: springshop
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog, version: v1}
    spec:
      containers:
      - name: catalog
        image: tektutor/springshop-catalog:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef: {fieldPath: metadata.name}
        readinessProbe:
          httpGet: {path: /actuator/health, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: springshop
spec:
  selector: {app: catalog}
  ports:
  - {name: http, port: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: springshop
spec:
  replicas: 1
  selector:
    matchLabels: {app: storefront}
  template:
    metadata:
      labels: {app: storefront, version: v1}
    spec:
      containers:
      - name: storefront
        image: tektutor/springshop-storefront:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef: {fieldPath: metadata.name}
        readinessProbe:
          httpGet: {path: /actuator/health, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: springshop
spec:
  selector: {app: storefront}
  ports:
  - {name: http, port: 8080}
---
apiVersion: v1
kind: Pod
metadata:
  name: curl
  namespace: springshop
spec:
  containers:
  - name: curl
    image: curlimages/curl:8.16.0
    command: ["sleep", "infinity"]

# An OpenShift Service Mesh 2 style gateway: it selects the shared
# ingress gateway that the control plane used to create.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: shop
  namespace: demo
spec:
  selector:
    istio: ingressgateway
  servers:
  - port: {number: 80, name: http, protocol: HTTP}
    hosts: ["shop.example.com"]

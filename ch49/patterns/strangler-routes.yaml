# The strangler pattern at the gateway of Chapter 15: the new catalog
# service answers /api/products/, and the old monolith answers the rest.
# Each step of the migration moves one more path to a new service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: ingress
spec:
  parentRefs:
  - name: public
    sectionName: http
  hostnames:
  - shop.tektutor.test
  rules:
  - matches:                                                   # (1)
    - path: {type: PathPrefix, value: /api/products/}
    backendRefs:
    - {name: catalog, namespace: shop, port: 8080}
  - backendRefs:                                               # (2)
    - {name: monolith, namespace: legacy, port: 8080}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: ingress-routes-to-catalog
  namespace: shop
spec:
  from:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: ingress}
  to:
  - {group: "", kind: Service, name: catalog}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: ingress-routes-to-monolith
  namespace: legacy
spec:
  from:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: ingress}
  to:
  - {group: "", kind: Service, name: monolith}

# The clusters that Envoy knows, in the same shape as a CDS response.
version_info: "1"
resources:
- "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
  name: inventory
  type: STRICT_DNS
  connect_timeout: 1s
  load_assignment:
    cluster_name: inventory
    endpoints:
    - lb_endpoints:
      - endpoint:
          address:
            socket_address: { address: inventory, port_value: 8080 }

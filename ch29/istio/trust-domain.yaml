# A new trust domain, with the old one as an alias, on top of the lab
# installation:
#   istioctl install -f ch13/istio/lab-install-ambient.yaml \
#     -f ch29/istio/trust-domain.yaml -y
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  meshConfig:
    trustDomain: tektutor.org                                  # (1)
    trustDomainAliases:                                        # (2)
    - cluster.local

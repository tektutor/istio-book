# The listener of envoy-base.yaml, with the tenant check loaded the way
# Istio loads Wasm: by name, from an extension config (ECDS) that Envoy
# reads from ECDS_FILE. istiod and istio-agent send it over xDS instead.
node: {id: ecds-demo, cluster: ecds-demo}
static_resources:
  listeners:
  - name: test
    address: {socket_address: {address: 127.0.0.1, port_value: 18600}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.network.\
            http_connection_manager.v3.HttpConnectionManager"
          stat_prefix: test
          route_config:
            virtual_hosts:
            - name: all
              domains: ["*"]
              routes:
              - match: {prefix: /}
                direct_response: {status: 200, body: {inline_string: "ok\n"}}
          http_filters:
          - name: tenant-check
            config_discovery:                                  # (1)
              config_source:
                path_config_source: {path: ECDS_FILE}
                initial_fetch_timeout: 2s
              type_urls:                                       # (2)
              - type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
              - type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
          - name: envoy.filters.http.router
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.filters.http.\
                router.v3.Router"
admin:
  address: {socket_address: {address: 127.0.0.1, port_value: 18601}}

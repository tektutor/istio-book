# The same rule as an HTTPRoute. A sidecar caller applies it itself; for
# ambient callers, the waypoint of the bookinfo namespace applies it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reviews
  namespace: bookinfo
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: reviews
    port: 9080
  rules:
  - matches:
    - headers:
      - name: end-user
        value: melissa
    backendRefs:
    - name: reviews-v3
      port: 9080
  - backendRefs:
    - name: reviews-v1
      port: 9080

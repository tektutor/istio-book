# The NetworkPolicy of Chapter 33 for shop, with the two rules that
# ambient mode needs. Apply it before the first pod moves: it also keeps
# allowing everything that sidecar pods need.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-from-mesh
  namespace: shop
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - ports:                                                     # (1)
    - { protocol: TCP, port: 15008 }
  - from:                                                      # (2)
    - ipBlock:
        cidr: 169.254.7.127/32
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: shop
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system
    ports:
    - { protocol: TCP, port: 15020 }
    - { protocol: TCP, port: 15090 }

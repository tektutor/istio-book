# A blue/green release of reviews: blue is v1, which serves every user,
# and green is v2, which only testers reach until the switch. The lab
# switches by changing one backend name, and switches back the same way.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reviews
  namespace: bookinfo
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: reviews
    port: 9080
  rules:
  - matches:                                       # (1)
    - headers:
      - name: end-user
        value: melissa
    backendRefs:
    - name: reviews-v2                             # (2)
      port: 9080
  - backendRefs:                                   # (3)
    - name: reviews-v1
      port: 9080

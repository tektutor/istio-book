# Version 2 of inventory, next to version 1 from Chapter 8, and a
# Service for each version. Both versions run the same image here; the
# lab makes v2 misbehave through its admin API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-v2
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
      version: v2
  template:
    metadata:
      labels:
        app: inventory
        version: v2                                # (1)
    spec:
      serviceAccountName: inventory
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: inventory
        image: tektutor/inventory:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-v1
  namespace: shop
spec:
  selector:
    app: inventory
    version: v1
  ports:
  - name: http
    port: 8080
    appProtocol: http
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-v2
  namespace: shop
spec:
  selector:
    app: inventory
    version: v2
  ports:
  - name: http
    port: 8080
    appProtocol: http

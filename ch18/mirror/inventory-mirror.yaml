# Every call to inventory goes to v1, and a copy goes to v2. The caller
# gets v1's answer; v2's answers are thrown away.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory
  namespace: shop
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: inventory
    port: 8080
  rules:
  - filters:
    - type: RequestMirror
      requestMirror:
        backendRef:
          name: inventory-v2                       # (1)
          port: 8080
        percent: 100                               # (2)
    backendRefs:
    - name: inventory-v1
      port: 8080

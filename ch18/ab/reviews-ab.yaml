# An A/B test: users whose cookie says group=b see reviews v2 with black
# stars, everybody else sees v1. productpage forwards the browser's
# cookies to reviews, so the rule works for calls from productpage.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reviews
  namespace: bookinfo
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: reviews
    port: 9080
  rules:
  - matches:
    - headers:
      - name: cookie
        type: RegularExpression
        value: "(^|.*; )group=b(;.*|$)"            # (1)
    backendRefs:
    - name: reviews-v2
      port: 9080
  - backendRefs:
    - name: reviews-v1
      port: 9080

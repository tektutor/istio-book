# Let the public gateway from Chapter 15 call productpage.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: productpage-allow-gateway
  namespace: bookinfo
spec:
  selector:
    matchLabels:
      app: productpage
  action: ALLOW
  rules:
  - from:
    - source:
        principals:                                            # (1)
        - tektutor.org/ns/ingress/sa/public-istio
        - cluster.local/ns/ingress/sa/public-istio

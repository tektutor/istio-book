# A mistake in ambient mode: an HTTP method in a policy that ztunnel
# enforces. ztunnel cannot read HTTP, so it drops the rule, and the
# ALLOW policy then allows nothing.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: reviews-allow-productpage
  namespace: bookinfo
spec:
  selector:                                                    # (1)
    matchLabels:
      app: reviews
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - tektutor.org/ns/bookinfo/sa/bookinfo-productpage
        - cluster.local/ns/bookinfo/sa/bookinfo-productpage
    to:
    - operation:
        methods: ["GET"]                                       # (2)
